<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>32×32 勇者スプライト試作</title>
  <style>
    :root{--ink:#1a233a;--paper:#f3eedc;--blue:#326991;--gold:#ebb441}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:ui-monospace,"SFMono-Regular","Cascadia Mono",monospace}.wrap{width:min(720px,calc(100% - 28px));background:#fffdf5;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--gold);padding:28px}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--blue);font-weight:800}h1{margin:8px 0 4px;font-size:clamp(22px,5vw,34px)}p{line-height:1.7}.stage{height:210px;margin:24px 0;background:repeating-linear-gradient(0deg,#dae6e5 0 16px,#dae6e5 16px,#cbdcda 17px);border:2px solid var(--ink);position:relative;overflow:hidden}.ground{position:absolute;left:0;right:0;bottom:30px;border-top:3px dashed rgba(26,35,58,.28)}.runner{position:absolute;left:50%;bottom:32px;width:128px;height:128px;transform:translateX(-50%);background:url('/assets/sprites/hero/run.png') 0 0/512px 128px no-repeat;image-rendering:pixelated;animation:run .62s steps(4) infinite,bob .31s steps(2) infinite}.dust{position:absolute;left:calc(50% - 88px);bottom:48px;color:#fff;font-size:30px;animation:dust .62s steps(2) infinite}.sheet{display:block;width:100%;max-width:640px;height:auto;image-rendering:pixelated;border:2px solid #d9d1bb;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0/16px 16px}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.tag{border:2px solid var(--ink);padding:5px 9px;font-size:12px;background:#fff}.actual{margin-top:22px;padding-top:18px;border-top:1px solid #ddd4bd}.actual img{width:128px;height:32px;image-rendering:pixelated;background:#eee}.back{display:inline-block;margin-top:22px;color:var(--ink);font-weight:800}@keyframes run{to{background-position:-512px 0}}@keyframes bob{50%{bottom:36px}}@keyframes dust{50%{opacity:.2;transform:translateX(-8px)}}@media(prefers-reduced-motion:reduce){.runner,.dust{animation:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <span class="eyebrow">RPG JOB / HERO</span>
    <h1>32×32 走る勇者</h1>
    <p>将来のジョブ選択を想定した、勇者の走行スプライトです。</p>
    <div class="stage"><div class="ground"></div><div class="dust">··</div><div class="runner" role="img" aria-label="職場へ走るドット絵の勇者"></div></div>
    <h2>スプライトシート（5倍表示）</h2>
    <img class="sheet" src="/assets/sprites/hero/run.png" alt="32×32ピクセル4フレームの勇者スプライト" width="640" height="160">
    <div class="meta"><span class="tag">128×32 PNG</span><span class="tag">4 frames</span><span class="tag">transparent</span><span class="tag">hero / run</span></div>
    <div class="actual"><strong>実寸：</strong> <img src="/assets/sprites/hero/run.png" alt="実寸の勇者スプライトシート"></div>
    <a class="back" href="/demo/">← アプリのデモへ戻る</a>
  </main>
</body>
</html>
